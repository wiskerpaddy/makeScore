<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="icon" href="icon.png" type="image/png">
    <title>Jazz Score Editor</title>
    <!-- ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <!-- 外部スタイルシート -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h3>Jazz Score Editor</h3>

    <details>
        <summary>記法リファレンス & サンプル集</summary>
        <div class="help-content">
            <p><strong>📖 基本記法チートシート</strong></p>
            <ul style="padding-left: 20px;">
                <li>音高: <code>C D E</code> (低) / <code>c d e</code> (高)</li>
                <li>長さ: <code>C2</code> (2倍) / <code>C/2</code> (半分) / <code>C3/2</code> (1.5倍)</li>
                <li>休符: <code>z</code> (1拍) / <code>Z</code> (1小節)</li>
                <li>和音: <code>[CEG]</code> (ドミソ)</li>
                <li>装飾: <code>!accent!</code>, <code>!>!</code>, <code>!tenuto!</code></li>
            </ul>

            <p><strong>🎸 ジャズ・サンプル（タップで挿入）</strong></p>
            <div class="sample-grid">
                <button onclick="setSample('X:1\nM:4/4\nK:C\nL:1/8\n(3DEF (3GAB (3cBA (3GFE | C8 |')">3連符練習</button>
                <button onclick="setSample('X:1\nM:4/4\nK:C\nL:1/8\n[CEGB]4 [DFAc]4 | [G B d f]8 |')">基本コード</button>
                <button onclick="setSample('X:1\nM:4/4\nK:C\nL:1/8\nz G !>!A z z G !>!A z | G2 !>!A6 |')">裏打ちリズム</button>
            </div>
        </div>
    </details>

    <div class="note-selector">
        <div class="duration-picker">
            <label><input type="radio" name="dur" value="2" checked> 4分</label>
            <label><input type="radio" name="dur" value="" > 8分</label>
            <label><input type="radio" name="dur" value="/2"> 16分</label>
        </div>
        
        <div class="note-grid">
            <button onclick="addNote('C')">ド</button>
            <button onclick="addNote('D')">レ</button>
            <button onclick="addNote('E')">ミ</button>
            <button onclick="addNote('F')">ファ</button>
            <button onclick="addNote('G')">ソ</button>
            <button onclick="addNote('A')">ラ</button>
            <button onclick="addNote('B')">シ</button>

            <button onclick="addNote('c')">ド↑</button>
            <button onclick="addNote('d')">レ↑</button>
            <button onclick="addNote('e')">ミ↑</button>
            <button onclick="addNote('f')">ファ↑</button>
            <button onclick="addNote('g')">ソ↑</button>
            <button onclick="addNote('a')">ラ↑</button>
            <button onclick="addNote('b')">シ↑</button>
            <button onclick="addNote('c\'')">ド↑↑</button>
        </div>
        <div class="note-selector">
            <div class="nuance-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px;">
                <button onclick="insertText('(')" style="background: #4a5568;">(スラー開始</button>
                <button onclick="insertText(')')" style="background: #4a5568;">)スラー終了</button>
                <button onclick="insertText('!>!')" style="background: #7d9e95;">アクセント</button>
                <button onclick="insertText('!.!')" style="background: #7d9e95;">スタッカート</button>
            </div>
            <div class="jazz-mode-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 8px;">
                <button onclick="insertText('\'Swing\' ')" style="background: #d4af37; color: #000;">🎷 Swing (Doo-Bah)</button>
                <button onclick="insertText('\'Straight\' ')" style="background: #2c3e50;">Straight</button>
            </div>
            <div class="note-grid"></div>
            <div class="function-grid"></div>
        </div>

        <div class="function-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 5px;">
            <button onclick="insertText('z ')" style="background: #555;">休符</button>
            <button onclick="insertText('| ')" style="background: #555;">小節線</button>
            <button onclick="deleteLast()" style="background: #e74c3c;">消去</button>
            <button onclick="checkRhythm()" class="btn-check" style="border: 1px solid #e74c3c;">楽譜チェック！</button>
        </div>
    </div>

    <div class="toolbar"></div>

    <textarea id="abc-input" spellcheck="false" inputmode="none" placeholder="ここに音符を追加してください"></textarea>

    <div id="paper"></div>
        <div class="save-area">
            <button onclick="saveAsImage()" class="btn-save"> 楽譜を画像として保存 </button>
        </div>
    </div>

<!-- 外部JavaScript -->
<script src="script.js"></script>
<script>
    // サービスワーカー（sw.js）をブラウザに登録する
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.error('Service Worker failed:', err));
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
