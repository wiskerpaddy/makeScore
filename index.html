<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazz Score Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 150px; font-size: 16px; margin-bottom: 20px; }
        #paper { background: #fff; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>Jazz Score Editor</h2>
    <textarea id="abc-input" placeholder="例: C D E F | G A B c">X:1
M:4/4
K:C
L:1/8
C D E F G A B c |</textarea>
    <div id="paper"></div>

    <script>
        const input = document.getElementById('abc-input');
        const render = () => {
            ABCJS.renderAbc("paper", input.value, { responsive: "resize" });
        };
        input.addEventListener('input', render);
        render(); // 初回描画
    </script>
</body>
</html>
