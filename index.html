<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazz Score Editor - Scout Edition</title>
    <!-- ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>
    <!-- 外部スタイルシート -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h3>Jazz Score Editor</h3>

    <details>
        <summary>記法のヒント（備忘録）</summary>
        <div class="help-content">
            <b>【基本】</b> <code>C D E F G A B c</code> / <code>^</code>(♯) <code>_</code>(♭) <code>=</code>(♮)<br>
            <b>【ジャズ】</b> <code>(3</code> (3連符) / <code>v</code> (アップ) / <code>u</code> (ダウン) / <code>!>!</code> (アクセント)
        </div>
    </details>

    <div class="toolbar">
        <button onclick="insertText('(3')">(3連符</button>
        <button onclick="insertText('!>!')">Accent</button>
        <button onclick="insertText('v')">Up Bow</button>
        <button onclick="insertText('u')">Down Bow</button>
        <button onclick="checkRhythm()" class="btn-check">拍数チェック</button>
    </div>

    <textarea id="abc-input" spellcheck="false">X:1
M:4/4
K:C
L:1/8
C D E F G A B c |</textarea>

    <div id="paper"></div>
</div>

<!-- 外部JavaScript -->
<script src="script.js"></script>
</body>
</html>
